name: Deploy Frontend to Dokploy

on:
  push:
    branches:
      - dev-luthfan  # Jalankan workflow saat ada push ke branch ini

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build and Push Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./batik-frontend
          file: ./batik-frontend/Dockerfile
          push: true
          tags: luthfan/trisara-frontend:latest

      # 4. Trigger Dokploy Webhook to redeploy
      - name: Trigger Dokploy Webhook
        run: |
          curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
