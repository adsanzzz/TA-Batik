services:
  # BACKEND SERVICE (FastAPI)
  backend:
    build:
      context: ./batik-backend
      dockerfile: Dockerfile
    image: luthfan/trisara-backend:latest
    environment:
      # Nilai diisi dari:
      #  - LOKAL   : root .env (folder yang sama dgn docker-compose.yml)
      #  - DOKPLOY : menu Environment di Dokploy
      # Tidak pakai env_file supaya deploy TIDAK gagal di server yang tak punya file .env.
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - HF_TOKEN=${HF_TOKEN}
      - HF_MODEL_ID=${HF_MODEL_ID:-Qwen/Qwen2.5-7B-Instruct}
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
      - QDRANT_HOST=qdrant
      # URL publik backend, dipakai untuk isi QR code photobox.
      # Wajib diisi di produksi (mis. https://api.trisarabatik.my.id).
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - QDRANT_PORT=${QDRANT_PORT:-6333}
      - HF_HOME=/app/hf_cache
    volumes:
      # CATATAN: JANGAN bind-mount ./batik-backend:/app di produksi.
      # Itu menimpa /app/models (yang di-download saat build) dengan folder host yang kosong.
      # Untuk dev lokal, boleh tambahkan sendiri: - ./batik-backend:/app
      - batik_uploads:/app/uploads
      - hf_cache:/app/hf_cache
    ports:
      - "8000:8000"
    depends_on:
      # DB remote (pkm) dipakai lewat env_file, jadi container db lokal TIDAK diperlukan.
      qdrant:
        condition: service_started
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # FRONTEND SERVICE (React + Nginx)
  frontend:
    build:
      context: ./batik-frontend
      dockerfile: Dockerfile
    image: luthfan/trisara-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # DATABASE SERVICE (PostgreSQL)
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-lutfan99}
      - POSTGRES_DB=${DB_NAME:-batik}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Tidak perlu ekspos port ke host (backend konek internal via "db:5432").
    # Kalau mau colok dari host (pgAdmin), tambahkan lagi: ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-batik}"]
      interval: 5s
      timeout: 5s
      retries: 12
  # VECTOR DATABASE SERVICE (Qdrant for RAG)
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      restart_policy:
        condition: on-failure

volumes:
  pgdata:
  batik_uploads:
  qdrant_data:
  hf_cache:
