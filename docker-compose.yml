services:
  # BACKEND SERVICE (FastAPI)
  backend:
    build:
      context: ./batik-backend
      dockerfile: Dockerfile
    image: trisara-batik-backend:latest
    env_file:
      - ./batik-backend/.env
    environment:
      # Semua DB & token (DB_*, HF_TOKEN, REPLICATE, dll) diambil dari env_file di atas
      # (./batik-backend/.env) -> jadi backend pakai DB REMOTE 'pkm' (203.145.34.144:59486).
      # Hanya override yang WAJIB beda di dalam Docker:
      - QDRANT_HOST=qdrant
      - HF_HOME=/app/hf_cache
    volumes:
      # CATATAN: JANGAN bind-mount ./batik-backend:/app di produksi.
      # Itu menimpa /app/models (yang di-download saat build) dengan folder host yang kosong.
      # Untuk dev lokal, boleh tambahkan sendiri: - ./batik-backend:/app
      - batik_uploads:/app/uploads
      - hf_cache:/app/hf_cache
    ports:
      - "8000:8000"
    depends_on:
      # DB remote (pkm) dipakai lewat env_file, jadi container db lokal TIDAK diperlukan.
      qdrant:
        condition: service_started
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # FRONTEND SERVICE (React + Nginx)
  frontend:
    build:
      context: ./batik-frontend
      dockerfile: Dockerfile
    image: trisara-batik-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # DATABASE SERVICE (PostgreSQL)
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-lutfan99}
      - POSTGRES_DB=${DB_NAME:-batik}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Tidak perlu ekspos port ke host (backend konek internal via "db:5432").
    # Kalau mau colok dari host (pgAdmin), tambahkan lagi: ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-batik}"]
      interval: 5s
      timeout: 5s
      retries: 12
  # VECTOR DATABASE SERVICE (Qdrant for RAG)
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      restart_policy:
        condition: on-failure

volumes:
  pgdata:
  batik_uploads:
  qdrant_data:
  hf_cache:
